<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GTG — Good To Go! Discover venues, plan group outings, and explore your city with friends. Foodie, Explorer, Adventurous, Chillaxed modes and more.">
  <meta name="keywords" content="GTG, Good To Go, venues, group outings, city explorer, nightlife, restaurants, events">
  <meta name="author" content="GTG App">
  <meta name="theme-color" content="#CE3131">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="GTG — Good To Go!">
  <meta property="og:description" content="Discover venues, plan group outings, and explore your city with friends.">
  <meta property="og:url" content="https://gtg-now.web.app">
  <meta property="og:image" content="https://gtg-now.web.app/icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GTG — Good To Go!">
  <meta name="twitter:description" content="Discover venues, plan group outings, and explore your city with friends.">
  <meta name="twitter:image" content="https://gtg-now.web.app/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GTG">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GTG — Good To Go!</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- PWA Install Banner (hidden by default) -->
  <div id="pwa-install-banner" style="
    display:none; position:fixed; bottom:0; left:0; right:0; z-index:99999;
    background:#CE3131; color:#fff; padding:14px 20px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px; box-shadow:0 -2px 12px rgba(0,0,0,.15);
    align-items:center; justify-content:space-between; gap:12px;">
    <span id="pwa-install-text">Install GTG for the best experience</span>
    <div style="display:flex;gap:8px;flex-shrink:0;">
      <button id="pwa-install-btn" style="
        background:#fff; color:#CE3131; border:none; border-radius:8px;
        padding:8px 18px; font-weight:600; font-size:14px; cursor:pointer;">
        Install
      </button>
      <button id="pwa-dismiss-btn" style="
        background:transparent; color:#fff; border:1px solid rgba(255,255,255,.4);
        border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer;">
        Not now
      </button>
    </div>
  </div>

  <script>
    // --- Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      // Unregister any leftover Flutter service worker, then register ours
      navigator.serviceWorker.getRegistration('/').then(async (existing) => {
        if (existing) {
          await existing.unregister();
          console.log('[GTG] Cleared old service worker');
        }
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('[GTG] Service Worker registered, scope:', reg.scope);
        }).catch((err) => {
          console.warn('[GTG] Service Worker registration failed:', err);
        });
      });
    }

    // --- PWA Install Prompt Interception ---
    let deferredPrompt = null;
    const banner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('pwa-install-btn');
    const dismissBtn = document.getElementById('pwa-dismiss-btn');
    const installText = document.getElementById('pwa-install-text');

    // Check if already installed or dismissed
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                      || window.navigator.standalone === true;
    const wasDismissed = sessionStorage.getItem('pwa-install-dismissed');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone && !wasDismissed) {
        banner.style.display = 'flex';
      }
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        console.log('[GTG] Install prompt result:', result.outcome);
        deferredPrompt = null;
      }
      banner.style.display = 'none';
    });

    dismissBtn.addEventListener('click', () => {
      banner.style.display = 'none';
      sessionStorage.setItem('pwa-install-dismissed', 'true');
    });

    // --- iOS "Add to Home Screen" guidance ---
    (function showIOSGuide() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS && !isStandalone && !wasDismissed) {
        installText.textContent = 'Tap the Share button ⎋ then "Add to Home Screen"';
        installBtn.style.display = 'none';
        banner.style.display = 'flex';
      }
    })();

    // --- Track QR install source ---
    (function trackQRSource() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('source') === 'qr_install') {
        console.log('[GTG] User arrived via QR code install link');
        sessionStorage.setItem('install_source', 'qr_install');
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
